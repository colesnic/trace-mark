[project]
name = "tracemark"
version = "0.1.0"
description = "Model-agnostic post-generation forensic watermarking gateway for LLM text"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "TraceMark" }]
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "spacy>=3.7.0",
    "sqlalchemy>=2.0.32",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
eval = [
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "sentence-transformers>=3.0.0",
]
postgres = [
    "asyncpg>=0.29.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.108.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracemark"]

[project.scripts]
tracemark = "tracemark.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["spacy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["en_core_web_sm.*"]
ignore_missing_imports = true
